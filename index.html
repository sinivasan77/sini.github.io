<!DOCTYPE html>
<html>
<head>
    <title>My Portfolio</title>
    <style>
        body{
            font-family: Arial;
            background:#f4f4f4;
            text-align:center;
            padding:40px;
        }

        .card{
            background:white;
            padding:30px;
            border-radius:10px;
            width:70%;
            margin:auto;
            box-shadow:0px 0px 10px gray;
        }

        img{
            width:150px;
            border-radius:50%;
        }

        h1{
            color:#333;
        }

        p{
            color:#555;
            font-size:18px;
        }

        a{
            text-decoration:none;
            color:white;
            background:blue;
            padding:10px 20px;
            border-radius:5px;
        }
    </style>
</head>

<body>

<div class="card">
    <img src="https://via.placeholder.com/150">

    <h1>Your Name</h1>

    <p>I am a Web Developer</p>

    <p>I know HTML, CSS and JavaScript</p>

    <a href="https://github.com/">My GitHub</a>
</div>

</body>
</html>
